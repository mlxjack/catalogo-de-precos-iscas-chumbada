<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Central de PreÃ§os - Chumbada Oficial</title>
  
  <!-- Fontes Premium: Montserrat (TÃ­tulos), Inter (Texto), Space Mono (Monospace TÃ¡tico) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --orange: #ff5500;
      --orange-glow: rgba(255, 85, 0, 0.45);
      --orange-dim: rgba(255, 85, 0, 0.15);
      --bg-deep: #050508;
      --bg-panel: #0b0b10;
      --bg-module: #101017;
      --border-dim: #1e1e2d;
      --border-bright: #ff5500;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --neon-cyan: #00f0ff;
      --neon-cyan-glow: rgba(0, 240, 255, 0.35);
      --neon-green: #39ff14;
      --white: #ffffff;
      --sidebar-width: 380px;
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-deep);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      /* Grid de Sonar Futurista */
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(255, 85, 0, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.02) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.003) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.003) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 50px 50px, 50px 50px;
    }

    /* --- LAYOUT DE CENTRAL TÃTICA --- */
    .dashboard {
      display: flex;
      min-height: 100vh;
      width: 100vw;
    }

    /* --- PAINEL LATERAL (CONTROLE) --- */
    .control-center {
      width: var(--sidebar-width);
      background-color: var(--bg-panel);
      border-right: 2px solid var(--border-dim);
      padding: 35px 25px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }

    /* Sonar Radar sweep background animation */
    .control-center::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      animation: scan-bar 5s linear infinite;
      pointer-events: none;
    }

    @keyframes scan-bar {
      0% { top: 0; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 20px;
    }

    .dashboard-logo {
      height: 55px;
      align-self: flex-start;
      filter: drop-shadow(0 0 15px var(--orange-glow));
    }

    .system-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--orange);
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .system-label::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--orange);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--orange);
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    .dashboard-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      font-style: italic;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--white);
    }

    .dashboard-title span {
      color: var(--orange);
    }

    /* SeÃ§Ãµes de DiagnÃ³sticos */
    .diagnostic-panel {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--border-dim);
      border-radius: 4px;
      padding: 12px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .diagnostic-line {
      display: flex;
      justify-content: space-between;
    }

    .diagnostic-line span.status-active {
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan-glow);
    }

    /* Pesquisa TÃ¡tica */
    .search-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-main);
    }

    .search-station {
      position: relative;
      width: 100%;
    }

    .search-station svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }

    .search-input {
      width: 100%;
      height: 46px;
      background: #12121b;
      border: 1px solid var(--border-dim);
      border-radius: 4px;
      padding: 0 16px 0 42px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--white);
      outline: none;
      transition: all 0.25s ease;
    }

    .search-input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 15px rgba(255, 85, 0, 0.25);
    }

    /* Radar Channels (Filtros de Categoria) */
    .radar-channels {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border-dim);
      padding-top: 20px;
    }

    .channel-btn {
      background: transparent;
      border: 1px solid transparent;
      padding: 12px 16px;
      border-radius: 4px;
      text-align: left;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .channel-btn::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0; width: 0;
      background: var(--orange-dim);
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: -1;
    }

    .channel-btn:hover {
      color: var(--text-main);
      border-color: var(--border-dim);
    }

    .channel-btn:hover::before {
      width: 100%;
    }

    .channel-btn.active {
      color: var(--white);
      border-color: var(--orange);
      background: rgba(255, 85, 0, 0.05);
      box-shadow: inset 0 0 10px rgba(255, 85, 0, 0.1);
    }

    .channel-btn.active::before {
      width: 100%;
      background: rgba(255, 85, 0, 0.08);
    }

    .channel-btn .channel-indicator {
      width: 6px;
      height: 6px;
      background: transparent;
      border-radius: 50%;
    }

    .channel-btn.active .channel-indicator {
      background: var(--orange);
      box-shadow: 0 0 8px var(--orange);
    }

    /* --- GRADE DE ISCAS (ÃREA PRINCIPAL) --- */
    .tactical-grid-area {
      margin-left: var(--sidebar-width);
      width: calc(100% - var(--sidebar-width));
      padding: 50px 40px;
    }

    .top-telemetry-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 15px;
    }

    .results-telemetry {
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--neon-cyan);
      text-shadow: 0 0 8px var(--neon-cyan-glow);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 30px;
    }

    /* --- CARD TÃTICO --- */
    .lure-module {
      background: var(--bg-module);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lure-module::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--orange), var(--neon-cyan));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .lure-module:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 85, 0, 0.4);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 85, 0, 0.08);
    }

    .lure-module:hover::before {
      opacity: 1;
    }

    /* Image Display Area with Sonar Scanlines */
    .module-display {
      height: 260px;
      background-color: #050508;
      background-image: 
        radial-gradient(circle at center, rgba(255, 85, 0, 0.1) 0%, transparent 70%),
        repeating-linear-gradient(rgba(255, 255, 255, 0.003) 0px, rgba(255, 255, 255, 0.003) 1px, transparent 1px, transparent 4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
      border-bottom: 1px solid var(--border-dark);
      overflow: hidden;
    }

    /* Hexagon decoration in display */
    .module-display::before {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      border: 1px dashed rgba(255, 85, 0, 0.15);
      border-radius: 50%;
      animation: rotate-radar 20s linear infinite;
    }

    @keyframes rotate-radar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .cat-badge {
      position: absolute;
      left: 16px;
      top: 16px;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: var(--neon-cyan);
      border: 1px solid rgba(0, 240, 255, 0.3);
      background: rgba(0, 240, 255, 0.05);
      padding: 4px 10px;
      border-radius: 3px;
      z-index: 15;
    }

    .new-release-tag {
      position: absolute;
      right: -32px;
      top: 16px;
      background: var(--orange);
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-size: 8px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 36px;
      transform: rotate(45deg);
      box-shadow: 0 4px 10px var(--orange-glow);
      z-index: 15;
    }

    .module-display img {
      max-width: 100%;
      max-height: 170px;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.7));
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 5;
    }

    .lure-module:hover .module-display img {
      transform: scale(1.1) translateY(-4px) rotate(-2deg);
    }

    /* Core details and tables */
    .module-body {
      padding: 24px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .module-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 10px;
    }

    .module-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 22px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      color: var(--white);
      letter-spacing: -0.02em;
    }

    /* Matrix Specs Table */
    .spec-matrix {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-grow: 1;
    }

    .spec-row {
      border: 1px solid var(--border-dim);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease;
    }

    .spec-row.wholesale-highlight {
      border-color: rgba(0, 240, 255, 0.2);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, rgba(0, 240, 255, 0.01) 100%);
    }

    .spec-row-header {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.01);
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .spec-row.wholesale-highlight .spec-row-header {
      border-bottom-color: rgba(0, 240, 255, 0.15);
      background: rgba(0, 240, 255, 0.02);
    }

    .spec-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--orange);
      text-transform: uppercase;
    }

    .spec-row.wholesale-highlight .spec-label {
      color: var(--neon-cyan);
    }

    .discount-badge {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      color: var(--neon-green);
      background: rgba(57, 255, 20, 0.08);
      padding: 2px 6px;
      border-radius: 2px;
      border: 1px solid rgba(57, 255, 20, 0.2);
    }

    .spec-rows-container {
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .matrix-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }

    .matrix-desc {
      color: var(--text-muted);
    }

    .matrix-prices {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .price-total {
      font-weight: 700;
      color: var(--white);
    }

    .spec-row.wholesale-highlight .price-total {
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .price-unit {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .spec-row.wholesale-highlight .price-unit {
      color: var(--neon-green);
    }

    /* Deploy button (militar style) */
    .deploy-btn {
      margin-top: 24px;
      height: 48px;
      background: transparent;
      border: 1px solid var(--orange);
      color: var(--white);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .deploy-btn::before {
      content: "";
      position: absolute;
      top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 85, 0, 0.2), transparent);
      transition: all 0.6s ease;
    }

    .deploy-btn:hover::before {
      left: 100%;
    }

    .deploy-btn:hover {
      background: var(--orange);
      box-shadow: 0 0 20px var(--orange-glow);
      border-color: var(--orange);
    }

    .deploy-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.5px;
    }

    .empty-state {
      grid-column: 1 / -1;
      border: 1px dashed var(--border-dim);
      background: rgba(255, 255, 255, 0.005);
      border-radius: 4px;
      padding: 80px 40px;
      text-align: center;
      font-family: 'Space Mono', monospace;
    }

    .empty-state h4 {
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      color: var(--orange);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 13px;
    }

    /* --- RESPONSIVIDADE --- */
    @media (max-width: 1024px) {
      .dashboard {
        flex-direction: column;
      }
      .control-center {
        width: 100%;
        position: relative;
        height: auto;
        border-right: none;
        border-bottom: 2px solid var(--border-dim);
        padding: 30px 20px;
      }
      .tactical-grid-area {
        margin-left: 0;
        width: 100%;
        padding: 30px 20px;
      }
    }

    @media (max-width: 580px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .dashboard-title {
        font-size: 20px;
      }
    }
  </style>
</head>

    const grid = document.getElementById('grid');

    const diagScan = document.getElementById('diagScan');
    
    // Gerar categorias dinamicamente
    const categories = ['Todos', ...Array.from(new Set(products.flatMap(p => p.categories)))];
    let activeCategory = 'Todos';

    // FUNÃ‡ÃƒO PARA CALCULAR PREÃ‡O UNITÃRIO
    function calculateUnitVal(desc, priceStr, defaultQty) {
      if (!priceStr) return null;
      const cleanPrice = parseFloat(priceStr.replace('R$', '').replace('.', '').replace(',', '.').trim());
      if (isNaN(cleanPrice)) return null;

      // Extrai quantidade do texto, ex: "6cm - 6un"
      const match = desc.match(/(\d+)\s*un/i);
      const qty = match ? parseInt(match[1]) : defaultQty;

      if (!qty || qty === 0) return null;
      const unit = cleanPrice / qty;
      return {
        unitPrice: unit.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }),
        rawUnit: unit
      };
    }

    // EXTRAI TAMANHO DE ISCA (ex: "6cm - 6un" -> "6cm")
    function parseSize(desc) {
      const match = desc.match(/^([\d.]+)\s*cm/i);
      return match ? match[1] + "cm" : desc.trim();
    }

    // CALCULA ECONOMIA PERCENTUAL
    function calculateSavings(product, size, kitUnitRaw) {
      if (!kitUnitRaw || !product.packs) return null;

      // Acha o pacote de varejo correspondente pelo tamanho
      const correspondingPack = product.packs.find(p => parseSize(p.desc) === size);
      if (!correspondingPack) return null;

      const packUnitInfo = calculateUnitVal(correspondingPack.desc, correspondingPack.price, 1);
      if (!packUnitInfo || !packUnitInfo.rawUnit) return null;

      const diff = packUnitInfo.rawUnit - kitUnitRaw;
      if (diff <= 0) return null;

      const percentage = (diff / packUnitInfo.rawUnit) * 100;
      return Math.round(percentage);
    }

    // RENDERIZAR UMA SEÃ‡ÃƒO DE ESPECIFICAÃ‡ÃƒO
    function renderSpecRow(title, items, defaultQty, isWholesale = false, productOriginal = null) {
      if (!items || items.length === 0) return '';
      
      const rowsHtml = items.map(item => {
        const unitInfo = calculateUnitVal(item.desc, item.price, defaultQty);
        let unitText = '';
        let savingsBadge = '';

        if (unitInfo) {
          unitText = `<span class="price-unit">${unitInfo.unitPrice}/un</span>`;
        }

        return `
          <div class="matrix-item">
            <span class="matrix-desc">${item.desc}</span>
            <div class="matrix-prices">
              <span class="price-total">${item.price}</span>
              ${unitText}
            </div>
          </div>
        `;
      }).join('');

      // Pega o primeiro item com desconto calculado (se houver) para botar no cabeÃ§alho do bloco
      let headBadge = '';
      if (isWholesale && defaultQty === 100 && productOriginal) {
        // Encontra o maior desconto do bloco
        let maxSavings = 0;
        items.forEach(item => {
          const size = parseSize(item.desc);
          const unitInfo = calculateUnitVal(item.desc, item.price, defaultQty);
          if (unitInfo) {
            const sav = calculateSavings(productOriginal, size, unitInfo.rawUnit);
            if (sav > maxSavings) {
              maxSavings = sav;
            }
          }
        });
        if (maxSavings > 0) {
          headBadge = `<span class="discount-badge">ECONOMIA DE ATÃ‰ ${maxSavings}%</span>`;
        }
      }

      return `
        <div class="spec-row ${isWholesale ? 'wholesale-highlight' : ''}">
          <div class="spec-row-header">
            <span class="spec-label">${title}</span>
            ${headBadge}
          </div>
          <div class="spec-rows-container">
            ${rowsHtml}
          </div>
        </div>
      `;
    }

    // RENDERIZAR CHIPS DE CATEGORIA (Sonar Channels)
    function renderChips() {
      chips.innerHTML = categories.map(cat => `
        <button class="channel-btn ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">
          <span>// ${cat.toUpperCase()}</span>
          <span class="channel-indicator"></span>
        </button>
      `).join('');
      
      document.querySelectorAll('.channel-btn').forEach(button => {
        button.addEventListener('click', () => {
          activeCategory = button.dataset.cat;
          renderChips();
          render();
        });
      });
    }

    // RENDERIZAR CENTRAL DE ISCAS
    function render() {
      const term = searchInput.value.trim().toLowerCase();
      
      // 1. Filtro da Linha Aji (tamanhos <= 6cm)
      const processedProducts = products.map(product => {
        const p = { ...product };
        
        if (activeCategory === 'Linha Aji') {
          const isAjiSize = (item) => {
            const match = item.desc.match(/^([\d.]+)\s*cm/i);
            return match ? parseFloat(match[1]) <= 6 : true;
          };
          p.packs = p.packs.filter(isAjiSize);
          p.kit20 = p.kit20.filter(isAjiSize);
          p.kit100 = p.kit100.filter(isAjiSize);
        }
        return p;
      });

      // 2. Filtro Geral
      const filtered = processedProducts.filter(product => {
        if (activeCategory === 'Linha Aji' && product.packs.length === 0 && product.kit20.length === 0 && product.kit100.length === 0) {
            return false;
        }

        const textToSearch = [
          product.name, 
          ...product.categories, 
          ...product.packs.map(i => i.desc + " " + i.price),
          ...product.kit20.map(i => i.desc + " " + i.price),
          ...product.kit100.map(i => i.desc + " " + i.price)
        ].join(' ').toLowerCase();

        const matchCategory = activeCategory === 'Todos' || product.categories.includes(activeCategory);
        const matchTerm = textToSearch.includes(term);

        return matchCategory && matchTerm;
      });

      count.textContent = `TARGETS FOUND // ${filtered.length.toString().padStart(2, '0')} DETECTED`;

        <article class="lure-module">
          <div class="module-display">
            <div class="cat-badge"><span>${product.categories.length > 0 ? product.categories[0].toUpperCase() : 'SOFT BAIT'}</span></div>
            ${product.isNew ? '<div class="new-release-tag"><span>LAUNCH</span></div>' : ''}
            <img src="${product.image}" alt="${product.name}" loading="lazy" onerror="this.src='assets/images/placeholder.svg'">
          </div>
          <div class="module-body">
            <div class="module-header">
              <h3 class="module-title">${product.name}</h3>
            </div>
            
            <div class="spec-matrix">
              ${renderSpecRow('Pacotes Varejo', product.packs, null, false)}
              ${renderSpecRow('Kits 20 unidades', product.kit20, 20, false)}
              ${renderSpecRow('Kits 100 unidades', product.kit100, 100, true, product)}
            </div>
            
            <a class="deploy-btn" href="${product.link}" target="_blank" rel="noopener">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
              DEPLOY // VER NA LOJA
            </a>
          </div>
        </article>
      `).join('');
    }

    searchInput.addEventListener('input', render);
    renderChips();
    render();
  </script>
</body>
</html>
